<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>下载专区 · 蓝屿手记</title>
<meta name="description" content="站内文件与外链下载，凭提取码获取。">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://api.github.com; frame-src https://music.163.com https://y.qq.com https://music.qq.com https://i.y.qq.com; form-action 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#050d22">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="aurora" aria-hidden="true">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
</div>

<header class="site-header">
  <div class="container nav-bar">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true">◆</span>
      <span data-site-name>蓝屿手记</span>
    </a>
    <nav class="nav-links" aria-label="主导航">
      <a href="index.html">首页</a>
      <a href="blog.html">文章</a>
      <a href="downloads.html" class="is-active">下载专区</a>
      <a href="login.html" data-user-entry>登录</a>
      <a href="admin.html" class="btn btn-ghost btn-sm">管理端</a>
    </nav>
  </div>
</header>

<main class="container page">
  <div class="section-head">
    <div>
      <h1 class="section-title">下载专区</h1>
      <p class="section-desc">共 <span id="dlCount">0</span> 个资源。支持站内文件与外链跳转两种方式。</p>
    </div>
  </div>

  <div class="notice">
    提取码用于防止误传与直链被索引。静态站点无法真正隐藏文件地址，请勿在此存放需要强保护的私密资料。
  </div>

  <div class="chips" id="dlChips"></div>

  <div class="grid-2" id="dlGrid">
    <div class="state-empty">正在读取资源…</div>
  </div>
</main>

<!-- 提取码弹层 -->
<div class="modal" id="codeModal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-panel glass" role="dialog" aria-modal="true" aria-labelledby="codeTitle">
    <div class="modal-head">
      <div>
        <h3 id="codeTitle">输入提取码</h3>
        <p class="modal-sub" id="codeSub">校验通过后显示下载入口。</p>
      </div>
      <button class="close-btn" type="button" data-close aria-label="关闭">×</button>
    </div>
    <div class="field">
      <label for="codeInput">提取码</label>
      <input type="text" id="codeInput" autocomplete="off" spellcheck="false" placeholder="区分大小写，前后空格自动忽略">
    </div>
    <p class="form-msg" id="codeMsg" role="status"></p>
    <div class="code-result" id="codeResult" hidden></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" type="button" data-close>取消</button>
      <button class="btn btn-primary" type="button" id="codeSubmit">验证并下载</button>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="container footer-inner">
    <span data-footer>以静态之力，行长期之事。</span>
    <div class="footer-links" data-social-list></div>
    <a href="admin.html">管理端</a>
  </div>
</footer>

<script src="assets/js/seed.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/downloads.js"></script>
</body>
</html>
