<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文章 · 蓝屿手记</title>
<meta name="description" content="蓝屿手记的文章列表：工程实践、视觉设计与产品思考。">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://api.github.com; frame-src https://music.163.com https://y.qq.com https://music.qq.com https://i.y.qq.com; form-action 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#050d22">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="aurora" aria-hidden="true">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
</div>

<header class="site-header">
  <div class="container nav-bar">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true">◆</span>
      <span data-site-name>蓝屿手记</span>
    </a>
    <nav class="nav-links" aria-label="主导航">
      <a href="index.html">首页</a>
      <a href="blog.html" class="is-active">文章</a>
      <a href="downloads.html">下载专区</a>
      <a href="login.html" data-user-entry>登录</a>
      <a href="admin.html" class="btn btn-ghost btn-sm">管理端</a>
    </nav>
  </div>
</header>

<main class="container page">
  <div id="listView">
    <div class="section-head">
      <div>
        <h1 class="section-title">文章</h1>
        <p class="section-desc">共 <span id="postCount">0</span> 篇，按发布时间倒序排列。</p>
      </div>
    </div>

    <div class="search-bar">
      <label class="sr-only" for="searchInput">搜索文章</label>
      <input type="search" id="searchInput" placeholder="搜索标题、摘要或标签 …" autocomplete="off">
    </div>
    <div class="chips" id="tagChips"></div>

    <div class="grid-3" id="postGrid">
      <div class="state-empty">正在读取文章…</div>
    </div>
  </div>

  <article id="detailView" class="article glass" hidden>
    <div class="article-head">
      <a class="section-link" href="blog.html">← 返回文章列表</a>
      <h1 id="articleTitle"></h1>
      <div class="article-meta">
        <span id="articleDate"></span>
        <span id="articleTags"></span>
      </div>
    </div>
    <div class="article-body" id="articleBody"></div>
  </article>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <span data-footer>以静态之力，行长期之事。</span>
    <div class="footer-links" data-social-list></div>
    <a href="admin.html">管理端</a>
  </div>
</footer>

<script src="assets/js/seed.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/blog.js"></script>
</body>
</html>
